<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know Your Footprints — Test Suite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0f1c; color: #f1f5f9; padding: 2rem; }
        h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; }
        .summary { display: flex; gap: 2rem; margin-bottom: 2rem; padding: 1.5rem; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .stat { display: flex; flex-direction: column; }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
        .stat-value.pass { color: #22c55e; }
        .stat-value.fail { color: #f43f5e; }
        .test-group { margin-bottom: 1.5rem; }
        .group-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .test { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.75rem; border-radius: 8px; margin-bottom: 0.25rem; font-size: 0.875rem; }
        .test.pass { background: rgba(34,197,94,0.08); }
        .test.fail { background: rgba(244,63,94,0.08); }
        .test-icon { font-size: 1rem; }
        .test-name { flex: 1; }
        .test-detail { color: #94a3b8; font-size: 0.75rem; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 1rem; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #14b8a6); border-radius: 3px; transition: width 0.5s ease; }
    </style>
</head>
<body>
    <h1>🧪 Know Your Footprints — Test Suite</h1>
    <p class="subtitle">Automated tests for all modules</p>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="summary">
        <div class="stat"><span class="stat-value" id="totalTests">0</span><span class="stat-label">Total Tests</span></div>
        <div class="stat"><span class="stat-value pass" id="passedTests">0</span><span class="stat-label">Passed</span></div>
        <div class="stat"><span class="stat-value fail" id="failedTests">0</span><span class="stat-label">Failed</span></div>
        <div class="stat"><span class="stat-value" id="passRate">0%</span><span class="stat-label">Pass Rate</span></div>
    </div>
    <div id="results"></div>

    <!-- Load modules under test -->
    <script src="../js/storage.js"></script>
    <script src="../js/calculator.js"></script>
    <script src="../js/challenges.js"></script>
    <script src="../js/whatif.js"></script>
    <script src="../js/timemachine.js"></script>
    <script src="tests.js"></script>
</body>
</html>
